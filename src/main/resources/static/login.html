<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Sign in | Smart Grocery</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/login.js" defer></script>
</head>

<body>
<main class="login-page">
    <div class="brand">Smart Grocery</div>

    <section class="login-card" aria-labelledby="login-title">
        <svg class="plant-icon"
             viewBox="0 0 80 80"
             fill="none"
             aria-hidden="true">
            <path d="M40 69C40 49 49 33 64 19"
                  stroke="#276632"
                  stroke-width="3"
                  stroke-linecap="round"/>

            <path d="M43 46C37 24 52 9 74 10
                     C75 31 62 48 43 46Z"
                  fill="#51A52C"/>

            <path d="M39 57C20 58 9 44 10 29
                     C29 29 42 39 39 57Z"
                  fill="#72B83C"/>

            <path d="M41 69C39 54 29 43 20 37
                     M44 45L62 24"
                  stroke="#276632"
                  stroke-width="2.5"
                  stroke-linecap="round"/>
        </svg>

        <h1 id="login-title">Welcome back</h1>

        <p class="login-description">
            Sign in to your Smart Grocery account.
        </p>

        <p id="login-message"
           class="login-message"
           role="status"
           aria-live="polite"
           hidden></p>

        <form id="login-form" action="/login" method="post">
            <div class="form-field">
                <label for="username">Username</label>

                <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        maxlength="50"
                        required
                >
            </div>

            <div class="form-field">
                <label for="password">Password</label>

                <div class="password-field">
                    <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                    >

                    <button
                            id="toggle-password"
                            class="password-toggle"
                            type="button"
                            aria-controls="password"
                            aria-label="Show password"
                            aria-pressed="false">
                        Show password
                    </button>
                </div>
            </div>

            <input id="csrf-token" type="hidden">

            <button id="sign-in-button"
                    class="sign-in-button"
                    type="submit">
                Sign in
            </button>
        </form>

        <p class="register-link">
            Don’t have an account?
            <a href="/register.html">Create an account</a>
        </p>

        <noscript>
            <p>Enable JavaScript to securely submit this form.</p>
        </noscript>
    </section>
</main>
</body>
</html>
