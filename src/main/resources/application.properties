spring.application.name=smart-daglig-vare

spring.datasource.url=jdbc:postgresql://localhost:5433/smart_grocery
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

kassalapp.base-url=https://kassal.app/api/v1
kassalapp.api-key=${KASSALAPP_API_KEY}

openai.base-url=https://api.openai.com/v1
openai.api-key=${AI_API_KEY}
openai.model=gpt-6-luna

geocoding.base-url=https://nominatim.openstreetmap.org
geocoding.user-agent=smart-daglig-vare/1.0 (https://github.com/Harii6)