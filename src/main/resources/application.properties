spring.application.name=smart-daglig-vare

spring.datasource.url=jdbc:postgresql://localhost:5433/smart_grocery
spring.datasource.username=postgres
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

kassalapp.base-url=https://kassal.app/api/v1
kassalapp.api-key=${KASSALAPP_API_KEY}

groq.base-url=https://api.groq.com/openai/v1
groq.api-key=${AI_API_KEY}
groq.model=openai/gpt-oss-20b
