<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Create account | Smart Grocery</title>

    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/register.js" defer></script>
</head>

<body>
<main class="login-page">
    <div class="brand">Smart Grocery</div>

    <section class="login-card" aria-labelledby="register-title">
        <svg class="plant-icon"
             viewBox="0 0 80 80"
             fill="none"
             aria-hidden="true">
            <path d="M40 69C40 49 49 33 64 19"
                  stroke="#276632"
                  stroke-width="3"
                  stroke-linecap="round"/>

            <path d="M43 46C37 24 52 9 74 10
                     C75 31 62 48 43 46Z"
                  fill="#51A52C"/>

            <path d="M39 57C20 58 9 44 10 29
                     C29 29 42 39 39 57Z"
                  fill="#72B83C"/>

            <path d="M41 69C39 54 29 43 20 37
                     M44 45L62 24"
                  stroke="#276632"
                  stroke-width="2.5"
                  stroke-linecap="round"/>
        </svg>

        <h1 id="register-title">Create an account</h1>

        <p class="login-description">
            Start planning your meals and grocery budget.
        </p>

        <p id="register-message"
           class="login-message"
           role="status"
           aria-live="polite"
           hidden></p>

        <form id="register-form"
              action="/api/auth/register"
              method="post">

            <div class="form-field">
                <label for="username">Username</label>

                <input
                        id="username"
                        name="username"
                        type="text"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        minlength="3"
                        maxlength="50"
                        pattern="[a-zA-Z0-9._\-]+"
                        aria-describedby="username-help"
                        required
                >

                <small id="username-help" class="field-help">
                    3–50 characters. Use letters, numbers,
                    dots, underscores or hyphens.
                </small>
            </div>

            <div class="form-field">
                <label for="password">Password</label>

                <div class="password-field">
                    <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"
                            minlength="15"
                            maxlength="64"
                            aria-describedby="password-help"
                            required
                    >

                    <button
                            id="toggle-password"
                            class="password-toggle"
                            type="button"
                            aria-controls="password confirm-password"
                            aria-label="Show passwords"
                            aria-pressed="false">
                        Show password
                    </button>
                </div>

                <small id="password-help" class="field-help">
                    Use 15–64 characters. A long, unique
                    passphrase works well.
                </small>
            </div>

            <div class="form-field">
                <label for="confirm-password">Confirm password</label>

                <input
                        id="confirm-password"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        minlength="15"
                        maxlength="64"
                        required
                >
            </div>

            <button id="register-button"
                    class="sign-in-button"
                    type="submit"
                    disabled>
                Create account
            </button>
        </form>

        <p class="register-link">
            Already have an account?
            <a href="/login.html">Sign in</a>
        </p>

        <noscript>
            <p>Enable JavaScript to create an account.</p>
        </noscript>
    </section>
</main>
</body>
</html>
